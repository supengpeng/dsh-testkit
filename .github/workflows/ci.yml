# dsh-testkit 的 CI 质量门。
#
# ## 为什么是这些组合
#
#   · Node 22.x / 24.x —— package.json 的 engines 要求 `>=22.19`；本机开发用 24.x。
#     两档都跑，才能发现"只在某一档 Node 上成立"的假设（glob、`node --test` 行为、
#     `fs` 新 API 等都会随大版本变）。
#   · ubuntu / windows / macos —— 本仓大量 driver 做的是**路径与外部进程**相关取证
#     （shell / file / fs driver、临时目录、大小写、换行符、`PATHEXT`）。
#     单平台绿**不能**代表可移植，而这类 bug 在开发机上永远复现不出来。
#
# ## 为什么只跑 `pnpm run gate`
#
# gate 就是开发者本机那条命令：编译 host 半 → 构建 client 半 → 校验场景 →
# 校验文档 → 适配层边界守卫 → 全量单测 → 导出 CI 用例并跑一遍 → client 半 typecheck。
# 不在这里另拼一套步骤，是为了避免"CI 绿但本地红"的双标准——
# 那种情况下 CI 的绿是**假绿**。
#
# ## 为什么不需要任何 secret
#
# 场景里凡是"会真的调模型/外部对象"的用例都有成本分级与标签隔离，
# gate 默认不跑它们（见 docs/FEATURES.md 与 docs/ROADMAP.md 的成本闸门部分）。
# 所以 CI 上不需要任何 API key —— 一个需要 secret 才能变绿的门，迟早会变成
# "在 fork 上永远红"的门。
#
# ## 本文件自己也被守卫
#
# `node scripts/check-ci-hardening.mjs`（gate 链里）会判：顶层 `permissions:`
# 不许含 write、每个 `uses:` 必须钉 40 位 commit SHA、禁 `pull_request_target`、
# 禁 secrets 取值表达式、禁 `continue-on-error: true`、安装必须带 `--frozen-lockfile`。
# 改这个文件前先读那份头注——它写清了每条规则防的是什么。

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一分支的连续推送取消旧运行：既省额度，也避免旧结论盖住新结论。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只需要读仓库：本工作流不发布、不写回。
permissions:
  contents: read

jobs:
  gate:
    name: gate · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台红不该掩盖其它平台的结果——9 个组合的结果都要能看到。
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # ⚠️ 三个 action 都钉到 **40 位 commit SHA**，不用 `@v4` 这类可变标签：
      # 标签可以被上游重新指向，等于把"在 CI 里执行任意代码"的权限交给别人。
      # SHA 来源（2026-10-10 用 GitHub API 取 v4 标签并二次核对：
      # `GET /repos/<owner>/<repo>/git/refs/tags/v4` → annotated tag 再取
      # `GET /repos/<owner>/<repo>/git/tags/<sha>` 拿 commit；并交叉核对
      # `GET /repos/<owner>/<repo>/commits/v4`，两者一致）：
      #   · actions/checkout v4      → 11d5960a326750d5838078e36cf38b85af677262
      #   · pnpm/action-setup v4     → b906affcce14559ad1aafd4ab0e942779e9f58b1（annotated tag）
      #   · actions/setup-node v4    → 49933ea5288caeca8642d1e84afbd3f7d6820020
      # 升级时：重新用 API 取 SHA，改这里，并把 `# v4` 注释一起更新。
      # 这条纪律由 `node scripts/check-ci-hardening.mjs` 机器守卫（gate 里会跑）。
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 版本与 pnpm-lock.yaml、package.json 的 packageManager 及本机一致
      # （node_modules/.modules.yaml 记录 pnpm@11.7.0）。
      # 钉死大版本以内的精确版本，避免"昨天还绿、今天 pnpm 发版就红"。
      # ⚠️ 这个版本必须与 package.json 的 `packageManager` 完全相同——
      # 由 `node scripts/check-lockfile.mjs` 跨文件守卫。
      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile：lockfile 与 package.json 不一致时**直接失败**，
      # 而不是在 CI 上偷偷改写依赖树。本仓不加新依赖是硬约束，这条是它的机器化身。
      - name: 安装依赖（严格按 lockfile）
        run: pnpm install --frozen-lockfile

      # 唯一的质量门：与开发者本机同一条命令。
      - name: 质量门（pnpm run gate）
        run: pnpm run gate

      # ⚠️ **独立步骤，故意不放进 gate。**
      #
      # 分工（这条分界是刻意的，别把它们合并回去）：
      #   · `pnpm run gate` ＝ 确定性质量门：**必须能在离线机器上跑通**
      #     （编译、场景校验、守卫、单测、导出用例）。它红了就是代码有问题。
      #   · 这一步 ＝ 需要**网络**的供应链信号：pnpm audit 要访问 registry，
      #     还会随"上游今天有没有发漏洞公告"而变。把它塞进 gate，
      #     等于让"网断了/上游加了条 advisory"把整个仓库判红。
      # 所以它单独一步：红了要人看一眼（是真漏洞还是 advisory 噪音），
      # 但它不阻断 gate 的结论。
      - name: 依赖审计（需要网络；不在 gate 内）
        run: pnpm audit --prod --audit-level=high
