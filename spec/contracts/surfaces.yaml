      这也是为什么计数必须由正则/运行时给出，不能数 `name:` 出现次数。
    evidence: [src/cli/index.ts:76, src/cli/index.ts:80-95]
  names:
    - { name: run, source_line: 80, available: true, args: '[ids...]' }
    - { name: list, source_line: 81, available: true }
    - { name: report, source_line: 82, available: true, args: '[runId]' }
    - { name: expand, source_line: 83, available: true, args: '<场景 ID>' }
    - { name: export, source_line: 84, available: true }
    - { name: import, source_line: 85, available: true, args: '<case.md>' }
    - { name: trace, source_line: 86, available: false }
    - { name: trend, source_line: 87, available: false }
    - { name: coverage, source_line: 88, available: false }
    - { name: search, source_line: 89, available: false }
    - { name: triage, source_line: 90, available: true }
    - { name: doctor, source_line: 91, available: true }
    - { name: registry, source_line: 92, available: true }
    - { name: fixtures, source_line: 93, available: true }
    - { name: version, source_line: 94, available: true }
    - { name: help, source_line: 95, available: true }
  available_false_note: >
    trace / trend / coverage / search 的 `available: false` 不是「未实现」而是「模块形状不满足」
    （见 src/cli/index.ts 的 available 字段与 src/cli/commands/insight.ts 的候选表）。
    运行时它们会明确报「未就绪」并给退出码 3（tests/cli.test.mjs:448-471）。
    这 4 条仍计入 16——注册面是「声明过的子命令」，可用性由 available 单独表达。
  declared_but_not_registered:
    - { name: collect, declared_in: docs/REWRITE-DESIGN.md:932 }
    - { name: refine, declared_in: docs/REWRITE-DESIGN.md:932 }
  docs_consistency:
    - { doc: README.md, line: 94, claims: '16 个 CLI 子命令', agrees: true }
    - { doc: README.md, line: 99, claims: '16 个 CLI 子命令', agrees: true }
    - { doc: docs/FEATURES.md, line: 42, claims: '独立 CLI（与命令面共用同一套引擎）', agrees: true }
    - { doc: docs/REWRITE-DESIGN.md, line: 934, claims: 'CLI 子命令 16 → 18', agrees: false, kind: 目标态 }
    - { doc: docs/rfc/0001-rust-core-full-rewrite.md, line: 190, claims: 'CLI 子命令 16 → 18', agrees: false, kind: 目标态 }
  separate_surface:
    name: DSH 命令面（/testkit）
    registered_commands: 1
    top_level_subcommands: 17
    nested_issue_subcommands: 7
    source: src/commands.ts:126-530（主 switch）、:546-623（issue 子 switch）
    recompute:
      - 'Select-String -Path $REPO/src/commands.ts -Pattern "case ''[a-z]+'':" | ForEach-Object { "$($_.LineNumber): $($_.Line.Trim())" }'
