    - { doc: docs/REWRITE-DESIGN.md, line: 934, claims: '工具 13 → 15（新增 testkit_collect / testkit_refine）', agrees: false, kind: 目标态 }
    - { doc: docs/rfc/0001-rust-core-full-rewrite.md, line: 190, claims: '工具 13 → 15', agrees: false, kind: 目标态 }

