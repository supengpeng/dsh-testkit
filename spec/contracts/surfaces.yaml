    - 'Select-String -Path $REPO/src/tools.ts -Pattern "name: ''testkit_" | ForEach-Object { $_.LineNumber }'
  names:
    - { name: testkit_list, source_line: 99, summary: 列出场景（可按 kind / tag / status 过滤，同时回显无法解析的文件） }
    - { name: testkit_run, source_line: 163, summary: 运行场景并写报告（总是带成本闸门） }
    - { name: testkit_report, source_line: 363, summary: 读取最近一次或指定 Run ID 的报告 }
