# ---------------------------------------------------------------- 5. 附加面：断言词（判定词汇表） --
assertion_words:
  note: >
    超出 spec/README.md §2 给 surfaces.yaml 划的四个面（工具 / CLI / kind / HTTP 路由），
    但同属「注册面」——断言词是 DSL 的对外词汇表，计数漂移的后果与工具数同级。
  runtime_source: src/runtime/assert.ts:22-37（ASSERTION_KEYS）
  type_source: src/cases/types.ts:107-128（Assertion 接口）
  count: 14
  names: [is, isNot, notIs, exists, notExists, contains, notContains, matches, atLeast, atMost, length, lengthAtLeast, lengthAtMost, throws]
  non_word_fields: [ref, soft]
  recompute:
    - '$NODE $REPO/bin/dsh-testkit.mjs list --json   # 不直接给词表；词表真源是 assert.ts'
    - 'Select-String -Path $REPO/src/runtime/assert.ts -Pattern "^\s+''\w+'',"   # 14 条'
  docs_consistency:
    reading_discipline: '读数的原值一律保留；真源修正后用 resolved_in 追加注解，不覆盖历史读数（Lead 2026-10-11 授权口径）。'
    entries:
      - { doc: README.md, line: 99, claims: '17 个断言词', agrees: false, resolved_in: 'docs/REWRITE-DESIGN.md §3.3 勘误 2026-10-11（17→16 = 14 求值词 + soft + ref）', clarification: '原「17」是把**字段数**当成了**词数**；16 = Assertion 接口的 16 个字段，而真正的求值词只有 14 个（本文件 count: 14 不变）' }
      - { doc: docs/FEATURES.md, line: 96, claims: '**17 个断言词**', agrees: false, resolved_in: 'docs/REWRITE-DESIGN.md §3.3 勘误 2026-10-11（17→16 = 14 求值词 + soft + ref）', clarification: '同上' }
      - { doc: docs/FEATURES.md, lines: '99-101', claims: '代码块里列 13 个词（缺 notIs）', agrees: false, resolved_in: 'docs/REWRITE-DESIGN.md §3.3 勘误 2026-10-11（17→16 = 14 求值词 + soft + ref）', clarification: '13 = 真 14 词漏掉 notIs；勘误后的 16 是字段口径，代词数仍应写 14' }
    reconcile_note: >
      勘误把「17」修正为「16 = 14 求值词 + soft + ref」。本节的 `count: 14` 是**求值词**口径
      （src/runtime/assert.ts:22-37 的 ASSERTION_KEYS），`non_word_fields: [ref, soft]` 是另两个字段口径，
      两者相加并计入 `ref` 即 16——**两个数字都正确，只是口径不同**，报告中必须写清用的是哪一个。

# ---------------------------------------------------------------- 漂移 --
drift:
  - id: DRIFT-SURF-1
    severity: high
    kind: 目标态 vs 现状（设计已声明差异，不算冲突，但**必须**在阶段 1 落地）
    detail: >
      docs/REWRITE-DESIGN.md:934 与 docs/rfc/0001-rust-core-full-rewrite.md:190 都写
      「工具 13 → 15、CLI 子命令 16 → 18」，而代码真源是 13 / 16，
      README.md:99 与 docs/FEATURES.md:8 记的也是 13 / 16。
      即：**设计文档记的是目标，README/FEATURES 记的是现状**，三处数字并存而不冲突。
      风险在于阶段 1 落地 collect/refine 时，README.md:94,99,100 与 FEATURES.md:8,42 都必须同步。
    evidence: [docs/REWRITE-DESIGN.md:930-934, docs/rfc/0001-rust-core-full-rewrite.md:190, README.md:99, docs/FEATURES.md:8]
    code_readout: { tools: 13, cli: 16 }
  - id: DRIFT-SURF-2
    severity: high
    kind: 守卫能力与声明不符
    detail: >
      docs/REWRITE-DESIGN.md:934 声称「计数由 pnpm run verify:docs 的检查项 ⑥ 与真源
      src/tools.ts / src/cli/index.ts 对齐」。实测：scripts/verify-docs.mjs 的 ⑥（L231-240）
      **只**校验「N 个 CLI 子命令」这一种表述，既不校验工具数（真源集合里没有 tools），
      也无法解析 §10.8 自己写的「CLI 子命令 **16 → 18**」（正则要求数字后紧跟「个 CLI 子命令」）。
      故「对齐」只对**另一种句式的当前值**成立，不是对工具的保证。
    evidence:
      - docs/REWRITE-DESIGN.md:934
      - scripts/verify-docs.mjs:126-131
      - scripts/verify-docs.mjs:231-240
      - scripts/verify-docs.mjs:133-139（collectGuardCount，也只有守卫数）
    recompute: '$NODE $REPO/scripts/verify-docs.mjs  # 输出行只有「CLI 子命令 16」，没有工具数'
  - id: DRIFT-SURF-3
    severity: medium
    kind: 文档词汇表与代码不一致
    detail: >
      断言词：代码真源 src/runtime/assert.ts:22-37 是 **14** 个（含 notIs）；
      README.md:99 与 docs/FEATURES.md:96 都称 **17 个**；而 docs/FEATURES.md:99-101
      自己列出的只有 **13** 个（漏了 notIs）。三个数字互不相等，且没有任何守卫覆盖断言词计数。
    evidence: [src/runtime/assert.ts:22-37, src/cases/types.ts:113, README.md:99, docs/FEATURES.md:96-101]
    code_readout: 14
    # 原读数保留（14 / 17 / 13 三个数字与各自出处都不改）；真源已在设计侧勘误。
    resolved_in: 'docs/REWRITE-DESIGN.md §3.3 勘误 2026-10-11（17→16 = 14 求值词 + soft + ref）'
    original_readings_preserved: { code: 14, README_claimed: 17, FEATURES_listed: 13 }
    resolution_note: >
      勘误澄清了"17"是把 Assertion 接口的**字段数**当成了**词数**：16 = 14 求值词 + soft + ref。
      故本节的 `count: 14` 与勘误的 `16` **不矛盾**（口径不同），但 README/FEATURES 里写"个断言词"的
      措辞仍需在阶段 1 与代码同步时改成明确口径，否则读者仍会混。
    remaining_work: 'README.md:99 与 docs/FEATURES.md:96-101 的措辞同步（是否随 collect/refine 那批一起改，由 lead 定）'
  - id: DRIFT-SURF-4
    severity: medium
