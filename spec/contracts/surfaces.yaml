# spec/contracts/surfaces.yaml
#
# 「注册面真源」：工具 / CLI 子命令 / kind / HTTP 路由的**逐个名字清单**与计数。
# 为什么必须列名字而不是只列计数：计数相等而名字不同是最难发现的漂移（改名不减数）。
#
# 真源优先级（遇到冲突时**以代码为准**）：
#   1. 运行时真源：tests/host-apply.test.mjs（真装进 cordis 容器后断言注册面）
#   2. 源码真源：src/tools.ts / src/cli/index.ts / src/kinds/index.ts / src/http.ts
#   3. 文档：README.md / docs/FEATURES.md / docs/REWRITE-DESIGN.md §10.8 / docs/ARCHITECTURE.md
#
# 本文件的所有读数都由下面的 recompute 命令实际跑出来，不抄文档。

meta:
  contract: 注册面（对外可观察的注册项集合）
  design_source: docs/REWRITE-DESIGN.md §10.8（L926-L934）；docs/REWRITE-DESIGN.md §2.2（L120-L139）
  rfc_source: docs/rfc/0001-rust-core-full-rewrite.md L190
  runtime:
    node: C:\Users\19059\.dsh\dsh-runtimes\dsh-primary-runtime\dependencies\node\bin\node.exe
    note: 本机无全局 node/pnpm；$REPO = 仓库根，$NODE 同上。
  recompute:
    - 'cd $REPO && $NODE --test tests/host-apply.test.mjs   # 运行时真源：13 个工具 + 4 条路由 + 1 个命令（断言在 L93-L125）'
    - '$NODE $REPO/bin/dsh-testkit.mjs help --json          # 16 个子命令逐个列名 + available 标记 + 退出码表'
    - '$NODE $REPO/bin/dsh-testkit.mjs version --json       # 12 个 kind 逐个列名（scenarioKinds）'
    - '$NODE $REPO/scripts/verify-docs.mjs                  # 守卫读数：CLI 子命令 16 / 守卫 12 / 场景 39（**不含工具数**）'
    - 'Select-String -Path $REPO/src/tools.ts -Pattern "name: ''testkit_"   # 工具名逐个列出'
  readouts:
    tool_count: 13
    cli_subcommand_count: 16
    kind_count: 12
    http_route_count: 4
    bridge_prefix: /api/dsh-testkit
    plugin_command_count: 1
    matches_design_target: false
    design_target: { tools: 15, cli: 18, kinds: 12, http_routes: 4 }

