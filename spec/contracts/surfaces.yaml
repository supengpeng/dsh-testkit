      是**两套不同的注册面**，计数不可混用。docs/FEATURES.md:36 明确写「下面是常用集」，
      列了 14 个名字（缺 registry / fixtures / help）——作为子集一致，但不是完整清单。
    evidence: [docs/FEATURES.md:33-37, src/commands.ts:129, src/commands.ts:135-530]

