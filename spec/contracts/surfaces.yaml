    - { name: testkit_trend, source_line: 581, summary: 历史趋势（kind / tag / owner / dshVersion） }
    - { name: testkit_coverage, source_line: 619, summary: 覆盖矩阵 + 缺口报告 }
    - { name: testkit_search, source_line: 627, summary: 场景全文搜索 }
