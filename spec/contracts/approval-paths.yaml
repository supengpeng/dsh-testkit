  denominator_note: >
    分母不随 observable 数量变化：**19** 是**声明的路径**（审批结果词汇 / 决策管道 / 提问应答形状 / 降级防御 四组，减去 DP-06）。
    沿革照抄 `spec/behaviors/kinds/interaction.md:212-218`：
    「`DP-06`（非 interaction 动作 → 显式报错）不是交互/审批路径（2026-10-11 裁决：出 B5 分母）：
    `interaction.ts:166-170` 的动作类型守卫是**每个 driver 都有一份**的通用输入校验（`tool.ts:442-446`、`llm.ts:195-199`、`session.ts:283-287`、`file.ts:166-170` 同款），
    它不承载任何交互/审批语义——把其中一份计入 B5 分母是机械展开的产物。
    沿革：它曾计入分母（原值 **20**），2026-10-11 因"不属审批面"移出（→ **19**）；**原值在此保留，分母变化必须可见**。」
