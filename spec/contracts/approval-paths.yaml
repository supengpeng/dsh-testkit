# spec/contracts/approval-paths.yaml
#
# 交互 / 审批路径清单 —— 指标 B5 的分母。
#   B5 审批路径覆盖 = spec 覆盖的交互/审批路径数 / 声明的路径总数（门槛 100%）
#   定义见 docs/REWRITE-METRICS.md §3 L85：「路径清单（interaction driver 的分支）与 spec 关联」。
#
# 真源：src/kinds/interaction.ts（唯一 interaction driver）。
# 声明形态真源：src/cases/types.ts:131-141（InteractionAction 联合类型）+ :40-63（Setup 形状）。
# 词汇真源：src/kinds/interaction.ts:37（APPROVAL_OUTCOMES，4 个值）。

meta:
  contract: 交互 / 审批路径（B5 的分母）
  metric: 'B5 审批路径覆盖 = spec 覆盖的交互/审批路径数 / 声明的路径总数（门槛 100%）'
  metric_source: docs/REWRITE-METRICS.md §3 L85
  driver_source: src/kinds/interaction.ts
  action_type_source: src/cases/types.ts:131-141（InteractionAction）
  setup_type_source: src/kinds/interaction.ts:40-63（InteractionQuestionSpec / InteractionApprovalSpec / InteractionSetup）
  waterfall_events:
    - { event: user-questions/request, next_shape: '() => Promise<AskUserQuestionAnswer>', source: src/kinds/interaction.ts:7-8 }
    - { event: approval/request, next_shape: '() => Promise<ApprovalOutcome>', source: src/kinds/interaction.ts:9-10 }
  critical_shape_note: >
    ⚠️ 这两个 waterfall 的 `next` 是 **`() => Promise<...>`**，而 `llm/stream` 的 `next` 是**同步**返回 AsyncIterable。
    照抄隔壁 driver 会得到 undefined 或未 await 的 Promise，且两种都是静默失效（interaction.ts:13-15）。
  runtime:
    node: C:\Users\19059\.dsh\dsh-runtimes\dsh-primary-runtime\dependencies\node\bin\node.exe
  recompute:
    - '$NODE $REPO/bin/dsh-testkit.mjs doctor   # 驱动 × 能力矩阵：interaction 行显示「需要 —」且不跳过（3/3 active）'
    - 'cd $REPO && $NODE --test tests/interaction-driver.test.mjs   # 18 条用例，逐条对应下面的路径 id'
    - 'Select-String -Path $REPO/src/kinds/interaction.ts -Pattern "APPROVAL_OUTCOMES|TESTKIT_"   # 词汇与标记错误枚举'
    - 'Select-String -Path $REPO/docs/SCENARIO-SPEC.md -Pattern "interaction:" -Context 0,20   # 面向作者的声明文档'
  readouts:
    paths_total: 20
    paths_with_unit_test: 16
    paths_without_unit_test: 4
    approval_outcome_vocabulary_size: 4
    grants: 1
    question_answer_modes: 4
    degradation_paths: 7
    driver_static_requires: []
    runtime_interaction_scenarios: { total: 3, active: 3, will_skip: false }

# ---------------------------------------------------------------- A. 审批结果词汇（DSH 词汇表） --
approval_outcomes:
  source: src/kinds/interaction.ts:37-38
  vocabulary: [allowed-once, rejected, cancelled, unavailable]
  vocabulary_doc: 'docs/SCENARIO-SPEC.md:652（allowed-once | rejected | cancelled | unavailable，缺省 rejected）'
  only_grant: allowed-once
  paths:
    - id: AP-01
      name: allowed-once（唯一授予）
      trigger: 'setup.interaction.approval.decision: allowed-once'
      code_ref: src/kinds/interaction.ts:151-159（注册答者）+ :93-101（normalizeDecision）
      observable: 'approvalOutcome === ''allowed-once''；fixture note plannedDecision 记同一值'
      tested_by: tests/interaction-driver.test.mjs:116-122（plannedDecision）、:203-213（释放后兜底）
      unit_tested: true
    - id: AP-02
      name: rejected（缺省值）
      trigger: 'decision: rejected，或**完全不写 decision**'
      code_ref: src/kinds/interaction.ts:94（`spec.decision ?? ''rejected''`）
      observable: 'approvalOutcome === ''rejected'''
      tested_by: tests/interaction-driver.test.mjs:62-66（normalizeDecision 缺省）、:169-183（act 端到端）
      unit_tested: true
    - id: AP-03
      name: cancelled
      trigger: 'decision: cancelled'
      code_ref: src/kinds/interaction.ts:37（词汇表）+ :93-101（校验通过即可注册）
      observable: 'approvalOutcome === ''cancelled'''
      tested_by: []
      unit_tested: false
      note: '词汇表里有、driver 原样透传，但**没有任何测试或场景覆盖**——属于声明了却无人走的路。'
    - id: AP-04
      name: unavailable（作为**声明值**）
      trigger: 'decision: unavailable'
      code_ref: src/kinds/interaction.ts:37
      observable: 'approvalOutcome === ''unavailable''（与 DP-03 的兜底值同形，来源不同）'
      tested_by: []
      unit_tested: false
      note: >
        与 DP-03 的兜底 `unavailable` **取值相同、来源不同**：这里是答者主动给的，
        DP-03 是没人答时的 fail-closed 兜底。测试里只覆盖了后者（L185-192），
        所以拿 `unavailable` 当断言目标时**无法区分**"答者给了 unavailable"与"没人答"。
    - id: AP-05
      name: 缺省决策（未声明 decision）
      trigger: 'setup.interaction.approval 只写 reason / 什么都不写'
      code_ref: src/kinds/interaction.ts:94
      observable: 'normalizeDecision 返回 rejected'
      tested_by: tests/interaction-driver.test.mjs:62-66
      unit_tested: true
    - id: AP-06
      name: 非法决策被拦下（带词汇表的错误）
      trigger: 'decision: ''yes'' 等不在词汇表里的值'
      code_ref: src/kinds/interaction.ts:95-101
      observable: '抛 Error，消息含「必须是：allowed-once | rejected | cancelled | unavailable」'
      tested_by: tests/interaction-driver.test.mjs:69-74（normalizeDecision 直测）、:128-134（setup 期在**注册前**拦下）
      unit_tested: true
      guard_value: >
        解析期拦下而不是让 DSH 把非法值归一化成 unavailable（interaction.ts:92）——
        "写错了"与"没人答"必须可区分。

# ---------------------------------------------------------------- Q. 提问应答形状 --
question_paths:
  source: src/kinds/interaction.ts:40-51（Spec）+ :70-90（buildAnswer）
  paths:
    - id: QP-01
      name: answer 简写
      trigger: 'question: { answer: ''选项 A'' }'
      code_ref: src/kinds/interaction.ts:77-81
      observable: 'answers[i].selected === [''选项 A'']'
      tested_by: tests/interaction-driver.test.mjs:27-31、:136-154
      unit_tested: true
    - id: QP-02
      name: select 显式数组（优先于 answer）
      trigger: 'question: { answer: ''x'', select: [''A'', ''B''] }'
      code_ref: src/kinds/interaction.ts:77-78
      observable: 'answers[i].selected === [''A'', ''B'']（select 覆盖 answer）'
      tested_by: tests/interaction-driver.test.mjs:32-36
      unit_tested: true
    - id: QP-03
      name: answers 完全显式（原样透传）
      trigger: 'question: { answers: [{ id, selected, custom }] }'
      code_ref: src/kinds/interaction.ts:74
      observable: '返回值逐字段等于声明的 answers（不再读 request.questions）'
      tested_by: tests/interaction-driver.test.mjs:37-42
      unit_tested: true
    - id: QP-04
      name: 未给任何选中项
      trigger: 'question: {} 或 { custom: ''…'' }（无 answer / select / answers）'
      code_ref: src/kinds/interaction.ts:77-81
      observable: 'selected === []（空数组，不崩、不猜）'
      tested_by: []
      unit_tested: false
      note: '唯一一条"空选中"路径，无测试覆盖。custom-only 的场景会静默走到这里。'
    - id: QP-05
      name: custom 自定义回答
      trigger: 'question: { custom: ''我自己写的'' }'
      code_ref: src/kinds/interaction.ts:87
      observable: '答案对象带 custom 字段'
      tested_by: tests/interaction-driver.test.mjs:56-61
      unit_tested: true
    - id: QP-06
      name: 多问题 / 问题缺 id 回落 q1..qN
      trigger: 'request.questions 多于一条，或某条没有 id'
      code_ref: src/kinds/interaction.ts:84-88
      observable: 'answers 与 questions 等长；缺 id 的回落为 `q${index+1}`'
      tested_by: tests/interaction-driver.test.mjs:43-50
      unit_tested: true
    - id: QP-07
      name: request 里没有 questions
      trigger: '答者收到 { } 或缺 questions'
      code_ref: src/kinds/interaction.ts:76
      observable: 'answers === []（不崩）'
      tested_by: tests/interaction-driver.test.mjs:51-55
      unit_tested: true
      # ── Lead 裁决 1（2026-10-11，采纳 spec-kinds 方案 A）：**保留在分母**，标不可表达 ──
      expressible: false
      spec_observable_covered: false
      unreachable_reason:
        summary: '**场景不可达**（属交互面，但 `given` 写不出来）——单测可达。'
        why_1: >
          `buildAnswer` 的 else 分支（interaction.ts:76 的 `Array.isArray(request?.questions) ? request.questions : []`）
          确实存在于实现里。
        why_2: >
          但 act 构造的 request **恒有 1 个 question**（interaction.ts:178-191 写死
          `questions: [{ id: 'testkit-q1', … }]`），而 act 是 `user-questions/request` 的**唯一触发点**
          ⇒ 该 else 分支在测试台**不可达**。
        why_3: '只有"真实宿主以空 questions 调该事件"时才可达——那是宿主的自由度，不是场景作者的。'
        declared_in: 'spec/behaviors/kinds/interaction.md:205-211（-001 边界与已知缺陷 #5）'
      previous_reading_preserved: 'unit_tested: true（原判成立且未变）；本条原先**没有** expressible 字段（当时整表默认可表达）'

# ---------------------------------------------------------------- D. 降级 / 能力 / 防御路径 --
degradation_paths:
  paths:
    - id: DP-01
      name: 提问超时（答者故意不答）
      trigger: 'question: { timeout: true }'
      code_ref: src/kinds/interaction.ts:136-140（抛错）+ :105（标记常量）
      observable: '抛 Error(TESTKIT_QUESTION_TIMEOUT)，error.code = ''ASK_TIMED_OUT''；act 捕获后记为 questionError；answer 缺省'
      tested_by: tests/interaction-driver.test.mjs:156-167
      unit_tested: true
    - id: DP-02
      name: 提问无答者（next 兜底抛错）
      trigger: 'act 触发了 user-questions/request，但没有任何 listener（未调 setup 或已 release）'
      code_ref: src/kinds/interaction.ts:200-204
      observable: 'next 抛 Error(TESTKIT_NO_ANSWERER)，被 act 捕获进 questionError'
      tested_by: []
      unit_tested: false
      note: >
        DSH 的语义是「答者缺席 → fail closed 成 unavailable」；本 driver 刻意换成显式错误，
        以便自检时区分"没人答"与"答错了"（interaction.ts:197-199）。
        **这条路径无测试**：`TESTKIT_NO_ANSWERER` 在 tests/ 与 cases/ 里零出现。
    - id: DP-03
      name: 审批无答者（fail closed 兜底）
      trigger: 'act 触发 approval/request 但没有 listener'
      code_ref: src/kinds/interaction.ts:228-230
      observable: 'outcome === ''unavailable''（与 DSH 的 fail-closed 语义一致）'
      tested_by: tests/interaction-driver.test.mjs:185-192（对照组）、:203-213（release 后重新生效）
      unit_tested: true
    - id: DP-04
      name: 宿主缺 userQuestions → 如实跳过
      trigger: 'setup.interaction.question 存在但宿主无 userQuestions 能力'
      code_ref: src/kinds/interaction.ts:120-122（setup）+ :175-177（act 再防一次）
      observable: '抛 SkipCase(「宿主不具备 userQuestions 能力…」) ⇒ 场景 skipped，不是 failed'
      tested_by: tests/interaction-driver.test.mjs:108-115
      unit_tested: true
      runtime_evidence: 'docs/ROADMAP.md:60-61 记录了真实 headless profile 下的这条读数'
    - id: DP-05
      name: approval-only 场景不因缺 userQuestions 而跳过
      trigger: 'setup 只写 approval，宿主无 userQuestions'
      code_ref: src/kinds/interaction.ts:110-113（**刻意不静态声明 requires**）
      observable: '场景正常跑，不 skip'
      tested_by: tests/interaction-driver.test.mjs:116-123（并把 plannedDecision 记为 allowed-once）、:215-217（断言不静态声明 requires）
      unit_tested: true
      spec_observable_covered: true
      spec_observable_covered_at: '2026-10-11 task-19 → spec/behaviors/kinds/interaction.md:156-159（-002 observable #9）'
      design_note: >
        这是 requires 的**一般规则**的一个反例：静态 requires 会让 approval-only 场景被误判成"缺能力"。
        故 interaction driver 的 requires 为空数组，能力判定放在分支内。
    - id: DP-07
      name: release 后答者被摘掉 → 兜底值重新生效
      trigger: 'fixture.release() 之后再次触发'
      code_ref: src/kinds/interaction.ts:144,160（ctx.fixture.add 登记 disposer）
      observable: 'question 侧重新抛 TESTKIT_NO_ANSWERER；approval 侧重新返回 unavailable'
      tested_by: tests/interaction-driver.test.mjs:203-213
      unit_tested: true
      # ── Lead 裁决 1（2026-10-11，采纳 spec-kinds 方案 A）：**保留在分母**，标不可表达 ──
      expressible: false
      spec_observable_covered: false
      unreachable_reason:
        summary: '**场景不可达**（属审批/交互面，但构造不出对应的 given）——单测可达。'
        why_1: >
          DSL 里唯一的提前释放入口是 `step.cleanup.releaseNotes`，它按**取证键**从 notes 取资源句柄
          （src/isolation/cleanup.ts:87-108 的 `stepResourceOf(fixture.getNote(key))`）。
        why_2: >
          本 driver 的两个 disposer 走 `fixture.add('interaction:question' | 'interaction:approval', …)`
          （interaction.ts:144,160）——**label 不进 notes，也没有任何 note 键指向它们** ⇒ `releaseNotes` 是 no-op。
        why_3: >
          更上游：全仓**没有任何 driver 调用** `registerStepDisposer`（isolation/cleanup.ts:60 定义、
          runner.ts:19,775 消费、src/kinds/** 零调用），裸函数路径 `fixture.note(key, fn)` 也零使用。
        declared_in: 'spec/behaviors/kinds/interaction.md:266-279（-002 边界与已知缺陷 #5）'
        framework_finding: >
          ⚠️ 这条同时暴露一条**框架级偏差**（不属本文件写权限，Lead 2026-10-11 已记下并另派任务）：
          docs/SCENARIO-SPEC.md:342-356 向场景作者承诺 `releaseNotes` 会"在本步结束后释放对应 disposer"，
          但当前实现对**全部 12 个 driver** 都不生效；且 cleanup.ts:58 的"找不到不报错"是**静默**的，
          没有任何测试会红。**DP-07 只是它的第一个受害者。**
      previous_reading_preserved: 'unit_tested: true（原判成立且未变）；本条原先**没有** expressible 字段（当时整表默认可表达）'

# ---------------------------------------------------------------- 移出分母的路径（分母变化必须可见） --
removed_from_denominator:
  note: >
    这里**不是**"删掉一条路径"，而是"它从来就不该在分母里"。按 Lead 裁决（2026-10-11）：
    **分母错要改定义；可达性缺口要留在清单里被看见**——两者性质不同，混在一起报出来的数字没有意义。
  entries:
    - id: DP-06
      name: 非 interaction 动作 → 显式报错
      was_counted: true
      previous_denominator: 20
      new_denominator: 19
      removed_at: '2026-10-11（Lead 裁决 1）'
      reclassification: '不属审批面（分母错），不是可达性缺口'
      why: >
        `interaction.ts:166-170` 的动作类型守卫是**每个 driver 都有一份**的通用输入校验
        （`tool.ts:442-446`、`llm.ts:195-199`、`session.ts:283-287`、`file.ts:166-170` 同款），
        它不承载任何交互/审批语义——把其中一份计入 B5 分母是机械展开的产物。
      still_facts_preserved:
        code_ref: src/kinds/interaction.ts:166-170
        observable: '抛 Error(「interaction driver 只支持 `interaction` 动作，收到：…」)'
        tested_by: tests/interaction-driver.test.mjs:194-201
        unit_tested: true
      same_family_never_counted:
        id: 'interaction.ts:241'
        text: '"interaction 动作必须包含 question 或 approval"'
        note: '同族守卫，**本来就没进分母**——两条现在都不在分母里，口径一致。'
      declared_in: 'spec/behaviors/kinds/interaction.md:212-218（沿革原文）'
      history_quote_from_spec: >
        「沿革：它曾计入分母（原值 **20**），2026-10-11 因"不属审批面"移出（→ **19**）；
        **原值在此保留，分母变化必须可见**。」

