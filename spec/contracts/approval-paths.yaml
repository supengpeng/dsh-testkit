# ---------------------------------------------------------------- B5 覆盖读数（不宣称 100%） --
b5_coverage:
  metric: 'B5 审批路径覆盖 = spec 覆盖的交互/审批路径数 / 声明的路径总数（docs/REWRITE-METRICS.md §3 L85；阶段 0 门槛 100%，§15 L316）'
  denominator: 19
  denominator_history:
    - { value: 20, from: '2026-10-11 阶段0-C（task-3）', until: '2026-10-11 阶段0-J（task-10）', note: '四组路径声明（审批词汇 6 / 提问 7 / 降级 7）' }
