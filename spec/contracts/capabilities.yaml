# spec/contracts/capabilities.yaml
#
# HostCapability 联合类型的**逐个成员清单** —— 指标 B2 的分母。
#   B2 能力覆盖 = spec 覆盖的能力数 / HostCapability 联合类型的能力总数（门槛 100%）
#   定义见 docs/REWRITE-METRICS.md §3 L82；「为什么能 100%」见 L89。
#
# ⚠️ 探测来源的**更正**（与直觉锚点不符，先写清）：
#   任务书提示「每个能力的探测来源（src/isolation/probes.ts 等）」。
#   实测：src/isolation/probes.ts **不是**能力探针——它探的是**残留**（tmpdir / 端口 / 进程，
#   见 probes.ts:1-21 与 detectResidue）。能力的真正探测链是：
#     ① 声明：src/cases/types.ts:26-50（HostCapability 联合类型，唯一真源）
#     ② 映射：src/host-facade.ts:29-54（CAPABILITY_SERVICE：能力名 → DSH 服务 key）
#     ③ 探测：src/host-facade.ts:105-147（CapabilitySet，**惰性** ctx.get()，每次现查）
#     ④ 组合：src/headless/index.ts:38-47（HEADLESS_CAPABILITIES：最小宿主具备哪些）
#     ⑤ 判定：src/runtime/runner.ts:332-337（driver.requires ∪ scenario.runtime.requires → SkipCase）
#     ⑥ 报告：src/doctor/run.ts:55-59（present / requiredByDrivers / missing）
#     ⑦ 缺口：src/cli/context.ts:201-219（describeHostGap：从 driver.requires 反推）
#   惰性求值的理由与实测证据见 src/host-facade.ts:88-104（快照式探测曾把 subagents / userQuestions 误判为缺失）。

meta:
  contract: HostCapability 能力面（B2 的分母）
  metric: 'B2 能力覆盖 = spec 覆盖的能力数 / HostCapability 成员总数（门槛 100%）'
  metric_source: docs/REWRITE-METRICS.md §3 L82、L89
  type_source: src/cases/types.ts:26-50
  service_map_source: src/host-facade.ts:29-54
  probe_source: src/host-facade.ts:105-147（CapabilitySet，惰性）
  gate_source: src/runtime/runner.ts:332-337
  headless_source: src/headless/index.ts:38-47
  report_source: src/doctor/run.ts:55-59
  runtime:
    node: C:\Users\19059\.dsh\dsh-runtimes\dsh-primary-runtime\dependencies\node\bin\node.exe
  recompute:
    - '$NODE <TEMP>/cap-refs.mjs $REPO   # 逐个能力列出 src/ 里所有引用点（本文件的 used_in / gated_in 即由它产出）'
    - 'Select-String -Path $REPO/src/cases/types.ts -Pattern "^\s{2}\|\s''\w+''"   # 联合类型成员枚举'
    - '$NODE $REPO/bin/dsh-testkit.mjs doctor   # 运行时读数：「具备」「driver 依赖的并集」「缺失」三段'
    - 'Select-String -Path $REPO/src/host-facade.ts -Pattern "^\s{2}[A-Za-z]+: ''[A-Za-z]+'',"   # 能力 → 服务映射'
  readouts:
    members_total: 20
    members_by_headless: 8
    members_with_static_requires: 8
    # ⚠️ 2026-10-11 阶段 1-B 复算更正：原读数 11 保留在下方 *_original。
    #    读到的原值不动（本仓读数纪律），新事实用更正块追加。
    members_gated_anywhere: 12
    members_gated_anywhere_original: 11
    members_gated_anywhere_correction:
      corrected_at: '2026-10-11（阶段 1-B crates/capability 独立复算）'
      original: 11
      corrected: 12
      evidence: '同文件逐成员 gated: true = 12；gated_in: [] = 8 = 20−12；与 segment_a_behavior 的 16 = 12 gated + 4 probe-only 自洽 ⇒ 错的是这条聚合读数，不是成员清单'
      recompute: "Select-String -Path <repo>/spec/contracts/capabilities.yaml -Pattern '^    gated: true$' | Measure-Object"
    members_with_zero_code_usage: 4
    # ⚠️ 读数纪律（Lead 2026-10-11 授权口径）：下面的 claimed 是**当时读到的原值**，一律不改。
    #    真源后来的变化属于"新事实"，用 status / resolved_in 追加注解表达，不覆盖历史读数。
    doc_claimed_counts:
      - { doc: 'docs/REWRITE-METRICS.md:89', claimed: 19, observed: 20, status: resolved, resolved_in: 'docs/REWRITE-METRICS.md B2 勘误 2026-10-11（19→20，含 4 个 declared-only 纪律）' }
      - { doc: 'docs/SCENARIO-SPEC.md:137-139', claimed: 14, observed: 20, status: open, note: '缺 llm / subagents / agentTeams / sessions / goals / compaction 六个名字；尚未修正（见 DRIFT-CAP-2）' }
    runtime_headless_present: 8
    runtime_headless_gap_vs_driver_union: [compaction, fs, subagents, subprocess]
    b2_display: '16/16（有行为）+ 4/4（declared-only，单列）'
    b2_note: '见顶层 b2_coverage：**不得**把两段合并成 20/20 = 100%'
  reading_discipline: >
    读数一旦写下就是事实记录；真源后来的变化是"新事实"，不是"旧读数错了"。
    故本文件的全部读数原样保留，只用 resolved_in / superseded_by / status / pending 追加注解，**不改数字**
    （Lead 2026-10-11 授权口径；与 spec/README.md §5 及 scripts/verify-docs.mjs 的 COUNT_EXEMPT_DOCS 同向）。
  headless_composition:
    source: src/headless/index.ts:38-47
    members: [tools, commands, systemPrompt, web, webServer, llm, userQuestions, approval]
    runtime_evidence: 'dsh-testkit doctor 的「具备」行：approval、commands、llm、systemPrompt、tools、userQuestions、web、webServer'
  driver_union:
    source: src/doctor/run.ts:57-59（按 driver.requires 推导）
    members: [commands, compaction, fs, llm, subagents, subprocess, systemPrompt, tools]
    runtime_evidence: 'dsh-testkit doctor 的「driver 依赖的并集」行'

