# ---------------------------------------------------------------- B2 风险面 --
b2_risk:
  zero_usage_members: [agentLoop, storage, timer, client]
  detail: >
    这 4 个成员只存在于联合类型与 CAPABILITY_SERVICE 映射里，src/ 中没有任何消费点，
    也没有任何场景能触发它们。B2 的分母是 20，但**可关联行为的只有 16 个**。
  ruling:
    decided_at: 2026-10-11
    decided_by: lead
    decision: '4 个零使用能力**不删类型**，改为各写一条 `declared_only: true` 条目（阶段 1 落实）。'
    reason: >
      它们是 `HostCapability` 公共联合类型的成员，删类型是**破坏性变更**；
      而 docs/rfc/0001-rust-core-full-rewrite.md §3.2 明确「`cases` schema 与数据结构不变」是本次重构的兼容承诺。
    rejected_option: '把它们从联合类型里删掉（并同步 CAPABILITY_SERVICE 与 SCENARIO-SPEC.md 词汇表）——否决。'
    reporting_rule: >
      **B2 的 100% 里必须把这 4 条与「有行为的能力」显式区分**——不许混在一起报 100%。
      正确形态是两段式读数：有行为的能力 16/16 + declared-only 4/4（declared-only 单列，不计入行为覆盖）。
  declared_only_entries_required:
    count: 4
    members: [agentLoop, storage, timer, client]
    required_fields: ['declared_only: true', 'reason: 只有联合类型成员身份，无消费点/无场景可触发']
    still_forbidden: '「写一条空条目凑覆盖率」被 spec/README.md §6 明确禁止（空条目按未覆盖计）——declared_only 条目必须写清"为什么没有行为"，不是占位。'
  probe_only_members: [approval, session, web, goals]
  probe_only_detail: '被探测/被使用但**从不按能力名门控**——它们不会让场景 skip，只会让 driver 走降级分支。'
  mapping_asymmetry:
    detail: '两个能力名与服务名不同：session → agents、client → clientModules（src/host-facade.ts:37,53）。'
    risk: '按能力名去 grep 服务消费点会漏掉这两处；阶段 1 的 Rust CapabilityGate 必须用同一张映射表，否则会静默判错。'

# ---------------------------------------------------------------- B2 覆盖读数（两段式，不许混报 100%） --
b2_coverage:
  metric: 'B2 能力覆盖 = spec 覆盖的能力数 / HostCapability 成员总数（docs/REWRITE-METRICS.md §3 L82；阶段 0 门槛 100%，§15 L316）'
  denominator: 20
  behavior_covered: 16
  declared_only: 4
  numerator_including_declared_only: 20
  ratio_including_declared_only: 1.0
  reporting_form: >
    **必须两段式报**：「有行为的能力 16/16」+「declared-only 4/4（单列）」。
    **不允许**只写「20/20 = 100%」——那会把"声明了但没有任何行为可验"与"有行为可验"混成一个数
    （Lead 2026-10-11 裁决；与 spec/README.md §6「禁止为凑覆盖率写空条目」同源）。
  segment_a_behavior:
    count: 16
    ratio: '16/16 = 100%'
    definition: '在 src/ 里有消费点或被能力门控引用：tools llm commands systemPrompt approval userQuestions session fs subprocess web webServer subagents agentTeams sessions goals compaction'
    recompute: '$NODE <TEMP>/cap-refs.mjs $REPO   # 逐个能力列出引用点；本段 16 个的引用数均 > 0'
  segment_b_declared_only:
    count: 4
    ratio: '4/4 = 100%（declared-only；单列，不计入上面的 16）'
    definition: '只有联合类型成员身份与能力→服务映射，src/ 里零消费点、零场景可触发'
    recompute: '$NODE <TEMP>/cap-refs.mjs $REPO   # 本段 4 个的引用数为 0；唯一的"命中"是映射表自身'
    entries:
      - capability: agentLoop
        declared_only: true
        defined_at: src/cases/types.ts:42
        service_map: 'src/host-facade.ts:42（agentLoop → agentLoop）'
        why_no_consumer: >
          本仓从不驱动宿主的 agent 主循环：`agent` kind 只走两条派生通道——`subagents`（一次性派生）
          与 `agentTeams`（可续接队友），见 src/kinds/agent.ts:403,422,478,461,547。
          src/ 里除映射表外 'agentLoop' 零出现。
        is_it_expressible: '不可表达：现有 12 个 kind 的语义里没有"驱动 agent 循环本身"这一类干预点。'
        stage1_disposition: '保留类型成员；在 CapabilityGate 里显式声明为 declared-only（永不触发，不参与策略矩阵）；不写空观测条目。'
      - capability: storage
        declared_only: true
        defined_at: src/cases/types.ts:48
        service_map: 'src/host-facade.ts:50（storage → storage）'
        why_no_consumer: >
          本仓的持久化需求由两条既有机制承担：会话日志检查点走 `sessions`（src/kinds/session.ts:254,362）
          与夹具的临时文件（`file` / `fs` kind）。src/ 里除映射表外 'storage' 零出现。
        is_it_expressible: '当前不可表达：没有 kind 需要通用键值存储的语义（`session` 的 flush 面已覆盖"持久化检查点"）。'
        stage1_disposition: '保留类型成员；声明为 declared-only；若阶段 4 引入数据集/资产缓存再评估是否升级为有行为的能力。'
      - capability: timer
        declared_only: true
        defined_at: src/cases/types.ts:49
        service_map: 'src/host-facade.ts:51（timer → timer）'
        why_no_consumer: >
          等待语义由 **Node 的 `setTimeout`** 直接实现（src/runtime/runner.ts:369,806,927 的 `{ wait: { ms } }` 分支），
          刻意不经宿主 timer 服务——等待是场景自己的时间控制，不是宿主能力。
          src/ 里除映射表外 'timer' 零出现。
        is_it_expressible: '不可表达：`{ wait: { ms } }` 已经覆盖等待，用宿主 timer 反而会把"场景自控的时间"绑到宿主实现上。'
        stage1_disposition: '保留类型成员；声明为 declared-only；不写空观测条目。'
      - capability: client
        declared_only: true
        defined_at: src/cases/types.ts:50
        service_map: 'src/host-facade.ts:53（client → clientModules）'
        why_no_consumer: >
          client 半产物的验证走 **`ui` kind**：它用 `node:vm` 直接加载 bundle 文件（默认 `<包根>/lib/client.js`，
          src/kinds/ui.ts:31,48-49），requires 为空——**不读宿主的 clientModules 注册表**。
          src/ 里除映射表外 'clientModules' 零出现。
        is_it_expressible: '不可表达：`ui` 验证的是 bundle 产物契约，而 `client` 能力描述的是宿主侧已装载模块的注册表——两者不是一回事。'
        stage1_disposition: '保留类型成员；声明为 declared-only；若阶段 4 要验证"宿主真的把本插件装载进 client 注册表"，再另立 kind 而不是复用这个能力名。'
  recompute:
    - '$NODE <TEMP>/cap-refs.mjs $REPO   # 引用的唯一真源：逐个能力在 src/ 里的出现点（排除联合类型与 CAPABILITY_SERVICE 映射本身）'
    - '$NODE $REPO/bin/dsh-testkit.mjs doctor   # 运行时读数：「具备」8 / 「driver 依赖的并集」8 / 「缺失」4'
    - 'Select-String -Path $REPO/src/cases/types.ts -Pattern "^\s{2}\|\s''\w+''"   # 分母 20 行'
  readings:
    - { key: members_total, value: 20, from: src/cases/types.ts:26-50 }
    - { key: behavior_covered, value: 16, from: 'cap-refs 引用数 > 0' }
    - { key: declared_only, value: 4, from: 'cap-refs 引用数 = 0' }
    - { key: b2_display, value: '16/16 + 4/4（分段）', note: 'B2 在报告里必须写成两段，不得合并成 20/20' }

