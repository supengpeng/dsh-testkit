    subtree: cases[].steps[].assertions[].assertion
    schema_fact: "schemas/run-report.schema.json 的 `$defs.assertion`（L238-L286）**没有** `additionalProperties: false`，注释明写「断言词集合归 cases 层维护，这里不锁死 additionalProperties，新增断言词不应让报告 Schema 拒绝」⇒ 它在本 schema 里**天然开放**。"
