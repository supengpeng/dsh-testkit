    fixed_key_set:
      count: 16
      keys:
        - ref
        - is
        - isNot
        - notIs
        - exists
        - notExists
        - contains
        - notContains
        - matches
        - atLeast
        - atMost
        - length
        - lengthAtLeast
        - lengthAtMost
        - throws
        - soft
      sources:
        ref + soft: src/cases/types.ts:107-128（Assertion 接口）
        14 个求值词: src/runtime/assert.ts:22-37（ASSERTION_KEYS）与 src/cases/schema.ts:50-65（ASSERTION_WORDS，同一份词表的第二处副本）
        回显点: src/runtime/runner.ts:736-743
      why_fixed_in_practice: 这 16 个键是既有实现**唯一**会主动产出/回显的键集：`ref` 必填、恰好一个求值词（cases/schema.ts:305-310）、`soft` 可选布尔。
    runtime_unknown_key_disposition:
      rule: 运行期出现不在 `fixed_key_set` 里的键（同一 `assertion` 对象上的新键）时：**既不报错也不忽略**——把它连同键名写进报告的 `uncompared_fields`（形如 `cases[i].steps[j].assertions[k].assertion.<新键>`），并在差异分类里归 `unknown`（A4 要求 unknown = 0 ⇒ 必须有人去补声明或补归一化）。
      why_not_fail: 开放子树的键可能来自"场景作者多写了一个词"或"未来新增的断言词"——两者都不该让对拍器崩，但都必须可见（§9.3 纪律 1）。
      reconciler_requirements:
        - ① 比对 `assertion` 时按 **键集差** 分组：固定键集逐键按各自 equivalence 比；剩余键全部进 uncompared_fields。
        - ② 不得因为出现未知键而把整条断言判为「结构不等价」——那是把"没声明"错误地当成"不等价"。
        - ③ uncompared_fields 必须携带键名与所属路径，否则无法据此补声明。
    sibling_instance_runtime_field_not_in_schema:
      field: cases[].trace
      note: 同一类问题的第二个活实例，但方向相反：`trace` 是**运行期真的写了、schema 里根本没有**（spec/behaviors/engine/report.md 的缺陷 RP-1；本机实跑 run.json 的 case 顶层键确认含 `trace`）。
      a3_scope: A3 的分母是 **schema 叶子集合**，`trace` 不在其中 ⇒ 它不影响 A3 读数，但它是「运行期字段 ∉ 声明集合」的真实样本，必须由 schema 侧修（属阶段 1 的 schema 变更，不在本次写权限内）。
      evidence: spec/behaviors/engine/report.md L516-521, L531-545；本机 2026-10-11 实跑 run.json：case 顶层键含 trace
    change_discipline: 新增断言词时必须**三处同步**，否则新词会静默落进 uncompared_fields：src/runtime/assert.ts 的 ASSERTION_KEYS、src/cases/schema.ts 的 ASSERTION_WORDS、以及本文件的 `fixed_key_set.keys`。（这也是本次实测发现的既有缺口：词表在 assert.ts 与 cases/schema.ts 各有一份副本，且没有任何守卫比对二者。）
