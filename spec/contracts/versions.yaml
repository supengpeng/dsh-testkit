  peer_dependencies:
    '@deepseek-ai/cordis': '>=4.0.4'
    '@deepseek-ai/dsh-llm': '>=0.2.0-rc.2'
    '@deepseek-ai/dsh-session': '>=0.2.0-rc.2'
    '@deepseek-ai/dsh-system-prompt': '>=0.2.0-rc.2'
    '@deepseek-ai/dsh-tools': '>=0.2.0-rc.2'
    '@deepseek-ai/schemastery': '>=3.0.0'
  dev_dependencies:
    '@deepseek-ai/cordis': '^4.0.4'
    '@deepseek-ai/dsh-llm': '^0.2.0-rc.2'
    '@deepseek-ai/dsh-session': '^0.2.0-rc.2'
    '@deepseek-ai/dsh-system-prompt': '^0.2.0-rc.2'
    '@deepseek-ai/dsh-tools': '^0.2.0-rc.2'
    '@deepseek-ai/schemastery': '^3.0.0'
  package_json_lines: { peer: 'package.json:78-85', dev: 'package.json:94-100' }
  engines_node: { range: '>=22.19', line: 'package.json:47-49' }

# ---------------------------------------------------------------- 文档一致性 --
docs_consistency:
  - { doc: docs/DSH-INTEGRATION.md, line: 14, claims: '"engines": { "dsh": ">=0.2.0-rc.2" }', agrees: true }
  - { doc: docs/DSH-INTEGRATION.md, line: 15, claims: '"compatibility": { "dshReleases": { "0.2.0-rc.2": "compatible" }, "profiles": ["desktop","web"] }', agrees: true }
  - { doc: docs/DSH-INTEGRATION.md, line: 62, claims: 'compatibility.dshReleases 记录**实测过**的版本（当前 0.2.0-rc.2）', agrees: true }
  - { doc: docs/DSH-INTEGRATION.md, line: 71, claims: '不承诺跨 DSH 大版本兼容', agrees: true }
  - { doc: docs/MIGRATION.md, line: 106, claims: 'dsh.engines: >=0.2.0-rc.2；兼容矩阵见 package.json 的 dsh.compatibility', agrees: true }
  - { doc: docs/DEVELOPMENT.md, line: 14, claims: 'DSH 版本 0.2.0-rc.2', agrees: true }
  - { doc: docs/ARCHITECTURE.md, line: 3, claims: '对应 DSH 0.2.0-rc.2', agrees: true }
  - { doc: README.md, line: 327, claims: '当前 DSH 版本 0.2.0-rc.2，profile desktop', agrees: true, incompleteness: '未提 profile web（package.json 声明两个）' }
  - { doc: docs/PUBLISHING.md, lines: '36-37', claims: '本仓对齐的是 0.2.0-rc.2', agrees: true }
  - { doc: docs/SCENARIO-SPEC.md, line: 241, claims: '夹具必备字段含 dsh_version', agrees: true }
  - { doc: docs/SCENARIO-SPEC.md, line: 245, claims: 'dsh_version 不匹配或夹具缺失/解析失败 → 场景 skipped 并说明原因', agrees: true, points_to: 'src/fixtures/apply.ts:146（skip 方向）' }

# ---------------------------------------------------------------- 漂移 --
drift:
  - id: DRIFT-VER-1
    severity: high
    kind: 声明与实现分离（B3 的口径风险）
    claim: >
      docs/REWRITE-METRICS.md:83 把 B3 的分子写成「spec 覆盖的 DSH 版本数 / **声明的支持版本总数**」，
      隐含「声明 = package.json 的 dsh.compatibility」。
    reality: >
      该声明在 src/ 里**零消费者**（唯一命中是 src/kinds/tool.ts:31 的注释）。运行期真正生效的版本判定
      是 fixture 的 dsh_version（src/fixtures/compat.ts 等）。照"声明"算分母则 B3 = spec 里出现
      `0.2.0-rc.2` 的次数，照"实现"算则要覆盖 compat.ts 的全部范围语法与两处相反方向的不可判定处置。
    evidence:
      - docs/REWRITE-METRICS.md:83
      - package.json:50-62
      - src/fixtures/compat.ts:215-293
      - src/fixtures/apply.ts:146
      - src/selection/by-version.ts:77
    impact: 'B3 在阶段 1 之前必须先冻结"版本覆盖"到底覆盖什么，否则 100% 是一个口径不明的数。'
  - id: DRIFT-VER-2
    severity: medium
    kind: 两处「不可判定」处置方向相反且只有一处写在文档
    claim: docs/REWRITE-METRICS.md:83 未区分选择期与执行期
    reality: >
      src/fixtures/apply.ts:146（执行期）在不可判定时 skip；
      src/selection/by-version.ts:77（选择期）在不可判定时**纳入**（多跑比少跑安全，by-version.ts:10-13 有明确理由）。
      两处都写明了理由，但没有任何一处把两者并列——单看任一处都会得出"处置矛盾"的结论。
    evidence: [src/fixtures/apply.ts:140-155, src/selection/by-version.ts:6-14, src/selection/by-version.ts:70-90]
  - id: DRIFT-VER-3
    severity: low
    kind: 文档措辞与声明的差异面
    claim: README.md:327「当前 DSH 版本 0.2.0-rc.2，profile desktop」
    reality: package.json:58-61 声明了两个 profile（desktop、web），且 README:102 自己记录了 web profile 的实测。
    evidence: [README.md:327, README.md:102, package.json:58-61]
  - id: DRIFT-VER-4
    severity: low
    kind: 任务锚点与代码不符
    claim: 阶段 0 任务描述写「fixtures/**/dshVersion」
    reality: 夹具 YAML 的字段名是 **snake_case** `dsh_version`（fixtures/schema.ts:127-132）；
      只有 CLI/工具面的 JSON 输出才用 camelCase `dshVersion`。两者都真实存在，但是不同层。
    evidence: [fixtures/llm/timeout.yaml:8, src/fixtures/schema.ts:126-132, src/cli/commands/inspect.ts]
